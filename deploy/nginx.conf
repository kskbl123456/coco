# ============================================================
# WLoc 面板与 PAC 托管 —— AWS 东京（57.181.170.250）
# ============================================================
# 域名分工（2026-10-09）：
#   ios.819263.xyz   ⚪ 灰云 → VPN 端点（UDP 500/4500，不走 nginx，此处无配置）
#   www.819263.xyz   🟠 橙云 → 用户面板
#   apple.819263.xyz 🟠 橙云 → PAC 托管
#   57.181.170.250   （IP 直连）→ 面板兜底
#
# ★★ 关键：nginx 必须绑网卡地址 103.115.57.227，不能写 0.0.0.0
#   因为 wloc-proxy 已绑 10.10.1.1:443（隧道内 TLS 中间人），
#   Linux 不允许再绑 0.0.0.0:443 → nginx 启动会报
#   bind() to 0.0.0.0:443 failed (98: Address already in use)
#   AWS 公网 IP 是 1:1 NAT 到内网 IP（dst 会被改写成内网地址），绑内网地址即可收到外部流量。
#   ⚠️ 103.115.57.227 是 DHCP 分配的，若重启后变了要同步改这里。

# ------------------------------------------------------------
# :80 —— 统一跳 HTTPS
# ------------------------------------------------------------
server {
    listen 103.115.57.227:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# ------------------------------------------------------------
# :443 面板域名 www.819263.xyz（CF 橙云）
# ------------------------------------------------------------
server {
    listen 103.115.57.227:443 ssl http2;
    server_name www.819263.xyz;

    ssl_certificate     /etc/nginx/ssl/www.819263.xyz.pem;
    ssl_certificate_key /etc/nginx/ssl/www.819263.xyz.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        # ★ CF 橙云下 $remote_addr 是 CF 节点 IP，真实客户端在 CF-Connecting-IP
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/user/download {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ------------------------------------------------------------
# :443 PAC 托管 apple.819263.xyz（CF 橙云）
# ------------------------------------------------------------
# 设备连上 VPN 后从 https://apple.819263.xyz/proxy.pac 取规则。
# 对齐 astrace 架构（astrace 的 PAC 在 apple.astraceios.com）。
server {
    listen 103.115.57.227:443 ssl http2;
    server_name apple.819263.xyz;

    ssl_certificate     /etc/nginx/ssl/apple.819263.xyz.pem;
    ssl_certificate_key /etc/nginx/ssl/apple.819263.xyz.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/wloc-pac;
    index proxy.pac;

    # PAC 文件：正确的 MIME + 禁缓存 + 允许跨源
    location = /proxy.pac {
        default_type application/x-ns-proxy-autoconfig;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
    }

    # 其余路径一律 404（不暴露面板）
    location / {
        return 404;
    }
}

# ------------------------------------------------------------
# :443 IP 直连兜底 + 未知域名
# ------------------------------------------------------------
# ★ 用 default_server 明确兜底，避免未知域名命中前面的块
server {
    listen 103.115.57.227:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/panel-ip.pem;
    ssl_certificate_key /etc/nginx/ssl/panel-ip.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/user/download {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ============================================================
# ============================================================
# 隧道内监听（10.10.0.1:443）—— PAC 托管
# ============================================================
# ★ 对齐 astrace 架构：443 = Web（PAC / API），8888 = 定位代理。
#   设备连上 VPN 后 apple.819263.xyz 由隧道内 DNS 解析到 10.10.0.1，
#   于是 PAC 请求走本 server，而不会撞上只认 gs-loc 的代理。
server {
    listen 10.10.0.1:443 ssl;
    server_name apple.819263.xyz;

    ssl_certificate     /etc/nginx/ssl/apple.819263.xyz.pem;
    ssl_certificate_key /etc/nginx/ssl/apple.819263.xyz.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/wloc-pac;
    index proxy.pac;

    location = /proxy.pac {
        default_type application/x-ns-proxy-autoconfig;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
# 隧道内监听（10.10.0.1:443 PAC / :8444 敏感 API）—— 敏感接口只在这里暴露
# ============================================================
# 设备必须先连上 VPN 才能访问这个地址：
#   · 隧道流量选择器是 10.10.0.0/24（见 ipsec.conf 的 leftsubnet）
#   · 描述文件的 IncludedRoutes 里有 10.10.0.0/24
# 所以「能访问到 10.10.0.1:8444」本身就等于「已连 VPN」。
#
# ★ 关键：proxy_set_header X-Real-IP $remote_addr
#   后端靠这个头判断来源是不是隧道内地址（10.20.0.0/24）。
#   不设的话后端看到的是 127.0.0.1，判定会失败。
#
# CORS 不在这里做 —— 交给 Flask 的 after_request 统一处理
# （nginx 的 if + add_header 继承规则很容易踩坑）。
server {
    listen 10.10.0.1:8444 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/tunnel.pem;
    ssl_certificate_key /etc/nginx/ssl/tunnel.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

# ============================================================
# 隧道内 :80 —— PAC 明文托管
#   对齐 astrace：描述文件的 PAC URL 用 http://
#   设备连 VPN 后 apple.819263.xyz 由隧道内 DNS 解析到 10.10.0.1，
#   于是 PAC 请求走本 server（明文，不依赖 TLS 信任链）。
# ============================================================
server {
    listen 10.10.0.1:80;
    server_name apple.819263.xyz;

    root /var/www/wloc-pac;
    index proxy.pac;

    location = /proxy.pac {
        default_type application/x-ns-proxy-autoconfig;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
    }

    location / {
        return 404;
    }
}

# WLoc 面板 —— 国内 PoC（京东云）
#
# ★★ 关键约束：京东云对 80/443 上「未备案域名」的访问会返回 403 拦截页
#    （页面里 iframe 指向 illegalitydomain.jcloud.com）。
#    实测：带 Host=www.niubi6666.kdns.fr → 403；不带域名（纯 IP）→ 200。
#
#    所以这里【故意不写 server_name 域名】，只支持 IP 访问。
#    域名请求会在到达 nginx 之前就被京东云拦掉，根本到不了这里。
#
#    要支持域名，只有两条路：
#      (a) 换一个能 ICP 备案的域名（.cn / .com 在国内注册商注册 + 备案，1~2 周）
#      (b) 面板搬到境外服务器（VPN 仍留在国内机）
#
# 证书：由 WLoc PoC CA 签发的 IP 证书。浏览器首次访问会警告（自建 CA），
#       把 /etc/ipsec.d/cacerts/wloc-cn-poc-ca-cert.pem 装进系统信任库可消除。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 统一跳 HTTPS（IP 访问不受京东云拦截影响）
    return 301 https://$host$request_uri;
}

server {
    # ★ 必须绑网卡地址，不能写 0.0.0.0
    #   因为 wloc-proxy 已经绑了 10.10.1.1:443（隧道内 TLS 中间人），
    #   Linux 不允许再绑 0.0.0.0:443 → nginx 启动会报
    #   bind() to 0.0.0.0:443 failed (98: Address already in use)
    #   公网 IP 不在本机（走 DNAT，dst 被改写成内网地址），所以绑内网地址即可收到外部流量。
    #   ⚠️ 172.16.0.10 是 DHCP 分配的，若重启后变了要同步改这里。
    #
    # nginx 1.24 不支持独立的 `http2 on;`（1.25+ 才有），用老写法
    listen 172.16.0.10:443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/panel-ip.pem;
    ssl_certificate_key /etc/nginx/ssl/panel-ip.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 面板
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 描述文件下载（大响应，单独放宽超时）
    location /api/user/download {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ============================================================
# 隧道内监听（10.10.1.1:8443）—— 敏感接口只在这里暴露
# ============================================================
# 设备必须先连上 VPN 才能访问这个地址：
#   · 隧道流量选择器是 10.10.1.1/32（见 ipsec.conf 的 leftsubnet）
#   · 描述文件的 IncludedRoutes 里有 10.10.1.1/32
# 所以「能访问到 10.10.1.1:8443」本身就等于「已连 VPN」。
#
# ★ 关键：proxy_set_header X-Real-IP $remote_addr
#   后端靠这个头判断来源是不是隧道内地址（10.20.0.0/24）。
#   不设的话后端看到的是 127.0.0.1，判定会失败。
#
# CORS 不在这里做 —— 交给 Flask 的 after_request 统一处理
# （nginx 的 if + add_header 继承规则很容易踩坑）。
server {
    listen 10.10.1.1:8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/tunnel.pem;
    ssl_certificate_key /etc/nginx/ssl/tunnel.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
